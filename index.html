<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>假名練習 かな・カナ</title>
<!-- iPhone「加入主畫面」後像 App 一樣全螢幕開啟 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="假名">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4f7cff">
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --text:#1f2430; --muted:#6b7280;
    --accent:#4f7cff; --accent-d:#3a63d8; --ok:#1faa6b; --ok-bg:#e5f7ee;
    --bad:#e5484d; --bad-bg:#fdecec; --border:#e3e7ef; --pink:#ff6fae; --pink-d:#e8559a;
    --review:#7c5cff; --review-d:#6a49f2;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151c; --card:#1c212c; --text:#eef1f7; --muted:#9aa3b2;
      --accent:#6b93ff; --accent-d:#5680f0; --ok:#3ddc97; --ok-bg:#123024;
      --bad:#ff6b6f; --bad-bg:#341b1d; --border:#2a3140; --pink:#ff86bd; --pink-d:#ff6fae;
      --review:#9d84ff; --review-d:#8b6dff;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; justify-content:center; padding:20px;
    min-height:100vh; min-height:100dvh;
  }
  .card{
    background:var(--card); border:1px solid var(--border);
    border-radius:20px; width:100%; max-width:460px;
    padding:28px 26px 30px; box-shadow:0 12px 40px rgba(0,0,0,.10);
    margin:auto;   /* 置中但內容過高時可往上捲,鍵盤彈出也不會擋住上方 */
  }
  /* 手機鍵盤彈出(可視高度變小)時,自動壓縮排版,讓題號/答對數看得到 */
  body.compact{padding:8px; align-items:flex-start}
  body.compact .card{margin:0 auto; padding:12px 16px 14px}
  body.compact .sub, body.compact .hint{display:none}
  body.compact h1{font-size:18px; margin:2px 0}
  body.compact .bar{margin:7px 0 4px}
  body.compact .kana{font-size:52px; margin:2px 0 0}
  body.compact #speak{margin:2px auto; padding:5px 14px; font-size:13px}
  body.compact input{padding:10px; font-size:19px}
  body.compact .msg{min-height:16px; margin:5px 0 2px; font-size:14px}
  body.compact .answer{min-height:14px; font-size:13px}
  body.compact button{margin-top:8px; padding:11px; font-size:16px}
  h1{font-size:24px; text-align:center; margin:6px 0 4px}
  .sub{text-align:center; color:var(--muted); font-size:14px; margin-bottom:14px}
  .top{display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--muted)}
  .bar{height:7px; background:var(--border); border-radius:99px; margin:14px 0 6px; overflow:hidden}
  .bar > i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .3s}
  .kana{text-align:center; font-size:120px; line-height:1.1; margin:16px 0 2px; font-weight:600; letter-spacing:2px}
  input{
    width:100%; font-size:22px; text-align:center; padding:14px;
    border:2px solid var(--border); border-radius:14px; background:transparent;
    color:var(--text); outline:none; transition:border-color .2s;
  }
  input:focus{border-color:var(--accent)}
  input.ok{border-color:var(--ok); background:var(--ok-bg)}
  input.bad{border-color:var(--bad); background:var(--bad-bg)}
  @keyframes shake{
    10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-9px)} 40%,60%{transform:translateX(9px)}
  }
  .shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
  .msg{min-height:24px; text-align:center; margin:12px 0 4px; font-size:15px; font-weight:600}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
  .answer{text-align:center; color:var(--muted); font-size:15px; min-height:20px}
  .answer b{color:var(--text); font-size:19px}
  button{
    width:100%; margin-top:14px; padding:14px; font-size:17px; font-weight:700;
    border:none; border-radius:14px; background:var(--accent); color:#fff;
    cursor:pointer; transition:background .2s, transform .05s;
  }
  button:hover{background:var(--accent-d)} button:active{transform:scale(.99)}
  button.ghost{background:transparent; color:var(--accent); border:2px solid var(--accent)}
  button.ghost:hover{background:transparent; color:var(--accent-d); border-color:var(--accent-d)}
  button.small{width:auto; display:block; margin:2px auto 4px; padding:8px 18px; font-size:14px}
  button.pink{background:var(--pink)} button.pink:hover{background:var(--pink-d)}
  button.review{background:var(--review)} button.review:hover{background:var(--review-d)}
  button.doba{background:#c98a3a} button.doba:hover{background:#b2762c}
  button.words{background:#ff8a3d} button.words:hover{background:#ee7526}
  .choose big{display:block; font-size:40px; font-weight:700; margin-bottom:2px}
  /* 範圍選擇 chips */
  .groups{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:4px 0 8px}
  .chip{
    width:auto; margin:0; padding:8px 15px; font-size:14px; font-weight:600;
    border:2px solid var(--border); border-radius:99px;
    background:transparent; color:var(--muted); transition:all .15s;
  }
  .chip:hover{background:transparent; border-color:var(--muted)}
  .chip.on{
    border-color:var(--accent); color:var(--accent);
    background:color-mix(in srgb, var(--accent) 14%, transparent);
  }
  .chip.on:hover{border-color:var(--accent-d)}
  .rangeInfo{text-align:center; color:var(--muted); font-size:13px; margin:0 0 12px}
  .rangeInfo b{color:var(--text)}
  /* どば 頁面 */
  #doba{
    position:relative; border-radius:14px; overflow:hidden;
    background:#333 center/cover no-repeat; background-image:url('doba.jpg');
    min-height:62vh; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    padding:28px 20px; text-align:center;
  }
  #doba::before{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.45))}
  #doba > *{position:relative; z-index:1}
  #dobaBack{width:auto; padding:12px 22px; background:rgba(255,255,255,.92); color:#2a2a2a}
  #dobaBack:hover{background:#fff}
  .hint{text-align:center; color:var(--muted); font-size:12.5px; margin-top:14px}
  .result{text-align:center}
  .score{font-size:64px; font-weight:800; margin:8px 0 0}
  .score small{font-size:22px; color:var(--muted); font-weight:600}
  .grade{font-size:19px; color:var(--muted); margin:4px 0}
  .hidden{display:none !important}
</style>

<div class="card">
  <!-- 主畫面:選範圍 + 模式 -->
  <div id="home">
    <h1>假名練習</h1>
    <div class="sub">かな ・ カナ ・ 選擇範圍與模式</div>

    <div class="groups">
      <button class="chip on" data-group="seion">清音</button>
      <button class="chip" data-group="dakuten">濁音・半濁音</button>
      <button class="chip" data-group="yoon">拗音</button>
    </div>
    <div class="rangeInfo">目前範圍共 <b id="rangeCount">46</b> 字</div>

    <button class="choose" data-mode="kata"><big>カ</big>片假名 Katakana</button>
    <button class="choose pink" data-mode="hira"><big>か</big>平假名 Hiragana</button>
    <button id="reviewBtn" class="choose review hidden"><big>✎</big>錯題重練 <span id="reviewCount">(0)</span></button>
    <button id="clearWrong" class="ghost small hidden">清空錯題本</button>
    <button id="dobaBtn" class="choose doba"><big>ど</big>どば</button>
    <button id="wordsBtn" class="choose words"><big>📇</big>單字卡 たんご</button>

    <div class="hint">羅馬拼音 / 平假名 / 片假名,任一種正確都算對。答錯的字會進錯題本,可隨時重練。</div>
  </div>

  <!-- 測驗畫面 -->
  <div id="quiz" class="hidden">
    <div class="top">
      <span><b id="modeLabel">片假名</b> · 第 <b id="qnum">1</b>/<span id="qtotal">46</span></span>
      <span>答對 <b id="score">0</b></span>
    </div>
    <div class="bar"><i id="prog"></i></div>

    <div class="kana" id="kana">ア</div>
    <button id="speak" class="ghost small" type="button">🔊 播放讀音</button>

    <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="輸入羅馬拼音 / 平假名 / 片假名">

    <div class="msg" id="msg">&nbsp;</div>
    <div class="answer" id="reveal"></div>

    <button id="check">送出</button>
    <button id="next" class="hidden">下一題 →</button>

    <div class="hint">答錯有第二次機會;第二次答對一樣算對。再錯會顯示答案並記入錯題本。</div>
  </div>

  <!-- 結果畫面 -->
  <div id="result" class="result hidden">
    <div class="grade" id="resultTitle">測驗完成 🎉</div>
    <div class="score"><span id="correctCount">0</span><small> / <span id="rtotal">46</span> 題</small></div>
    <div class="grade" id="comment"></div>
    <button id="again">再玩一次</button>
    <button id="backHome" class="ghost">回主畫面</button>
  </div>

  <!-- どば 頁面 -->
  <div id="doba" class="hidden">
    <button id="dobaBack">← 回上一頁</button>
  </div>
</div>

<script>
// [片假名, [羅馬拼音...], 平假名, 分組]
const KANA = [
  // ── 清音 seion ──
  ["ア",["a"],"あ","seion"],["イ",["i"],"い","seion"],["ウ",["u"],"う","seion"],["エ",["e"],"え","seion"],["オ",["o"],"お","seion"],
  ["カ",["ka"],"か","seion"],["キ",["ki"],"き","seion"],["ク",["ku"],"く","seion"],["ケ",["ke"],"け","seion"],["コ",["ko"],"こ","seion"],
  ["サ",["sa"],"さ","seion"],["シ",["shi","si"],"し","seion"],["ス",["su"],"す","seion"],["セ",["se"],"せ","seion"],["ソ",["so"],"そ","seion"],
  ["タ",["ta"],"た","seion"],["チ",["chi","ti"],"ち","seion"],["ツ",["tsu","tu"],"つ","seion"],["テ",["te"],"て","seion"],["ト",["to"],"と","seion"],
  ["ナ",["na"],"な","seion"],["ニ",["ni"],"に","seion"],["ヌ",["nu"],"ぬ","seion"],["ネ",["ne"],"ね","seion"],["ノ",["no"],"の","seion"],
  ["ハ",["ha"],"は","seion"],["ヒ",["hi"],"ひ","seion"],["フ",["fu","hu"],"ふ","seion"],["ヘ",["he"],"へ","seion"],["ホ",["ho"],"ほ","seion"],
  ["マ",["ma"],"ま","seion"],["ミ",["mi"],"み","seion"],["ム",["mu"],"む","seion"],["メ",["me"],"め","seion"],["モ",["mo"],"も","seion"],
  ["ヤ",["ya"],"や","seion"],["ユ",["yu"],"ゆ","seion"],["ヨ",["yo"],"よ","seion"],
  ["ラ",["ra"],"ら","seion"],["リ",["ri"],"り","seion"],["ル",["ru"],"る","seion"],["レ",["re"],"れ","seion"],["ロ",["ro"],"ろ","seion"],
  ["ワ",["wa"],"わ","seion"],["ヲ",["wo","o"],"を","seion"],["ン",["n","nn"],"ん","seion"],

  // ── 濁音・半濁音 dakuten ──
  ["ガ",["ga"],"が","dakuten"],["ギ",["gi"],"ぎ","dakuten"],["グ",["gu"],"ぐ","dakuten"],["ゲ",["ge"],"げ","dakuten"],["ゴ",["go"],"ご","dakuten"],
  ["ザ",["za"],"ざ","dakuten"],["ジ",["ji","zi"],"じ","dakuten"],["ズ",["zu"],"ず","dakuten"],["ゼ",["ze"],"ぜ","dakuten"],["ゾ",["zo"],"ぞ","dakuten"],
  ["ダ",["da"],"だ","dakuten"],["ヂ",["ji","di"],"ぢ","dakuten"],["ヅ",["zu","du"],"づ","dakuten"],["デ",["de"],"で","dakuten"],["ド",["do"],"ど","dakuten"],
  ["バ",["ba"],"ば","dakuten"],["ビ",["bi"],"び","dakuten"],["ブ",["bu"],"ぶ","dakuten"],["ベ",["be"],"べ","dakuten"],["ボ",["bo"],"ぼ","dakuten"],

  // 半濁音(併入濁音組)
  ["パ",["pa"],"ぱ","dakuten"],["ピ",["pi"],"ぴ","dakuten"],["プ",["pu"],"ぷ","dakuten"],["ペ",["pe"],"ぺ","dakuten"],["ポ",["po"],"ぽ","dakuten"],

  // ── 拗音 yoon ──
  ["キャ",["kya"],"きゃ","yoon"],["キュ",["kyu"],"きゅ","yoon"],["キョ",["kyo"],"きょ","yoon"],
  ["シャ",["sha","sya"],"しゃ","yoon"],["シュ",["shu","syu"],"しゅ","yoon"],["ショ",["sho","syo"],"しょ","yoon"],
  ["チャ",["cha","tya"],"ちゃ","yoon"],["チュ",["chu","tyu"],"ちゅ","yoon"],["チョ",["cho","tyo"],"ちょ","yoon"],
  ["ニャ",["nya"],"にゃ","yoon"],["ニュ",["nyu"],"にゅ","yoon"],["ニョ",["nyo"],"にょ","yoon"],
  ["ヒャ",["hya"],"ひゃ","yoon"],["ヒュ",["hyu"],"ひゅ","yoon"],["ヒョ",["hyo"],"ひょ","yoon"],
  ["ミャ",["mya"],"みゃ","yoon"],["ミュ",["myu"],"みゅ","yoon"],["ミョ",["myo"],"みょ","yoon"],
  ["リャ",["rya"],"りゃ","yoon"],["リュ",["ryu"],"りゅ","yoon"],["リョ",["ryo"],"りょ","yoon"],
  ["ギャ",["gya"],"ぎゃ","yoon"],["ギュ",["gyu"],"ぎゅ","yoon"],["ギョ",["gyo"],"ぎょ","yoon"],
  ["ジャ",["ja","jya","zya"],"じゃ","yoon"],["ジュ",["ju","jyu","zyu"],"じゅ","yoon"],["ジョ",["jo","jyo","zyo"],"じょ","yoon"],
  ["ビャ",["bya"],"びゃ","yoon"],["ビュ",["byu"],"びゅ","yoon"],["ビョ",["byo"],"びょ","yoon"],
  ["ピャ",["pya"],"ぴゃ","yoon"],["ピュ",["pyu"],"ぴゅ","yoon"],["ピョ",["pyo"],"ぴょ","yoon"],
];

const GROUP_LABEL = {seion:"清音", dakuten:"濁音・半濁音", yoon:"拗音"};
const GKEY = "kana_groups_v1";
const WKEY = "kana_wrong_v1";

// deck 內每題 = { item:[…], mode:"kata"|"hira" }
let deck=[], idx=0, correct=0, attempts=0, total=0, reviewMode=false;
const selectedGroups = new Set(["seion"]);

const $ = id => document.getElementById(id);

function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function norm(s){
  return (s||"").trim().toLowerCase().replace(/\s+/g,"").replace(/[ー－-]/g,"");
}
// 這一題要顯示的字(依該題自己的模式)
function shownChar(entry){ return entry.mode==="kata" ? entry.item[0] : entry.item[2]; }

// 唸出讀音(iPhone Safari 支援;需在使用者互動後觸發)
function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang="ja-JP"; u.rate=0.8;
    const jp = speechSynthesis.getVoices().find(v=>/ja(-|_)?jp/i.test(v.lang) || /japanese/i.test(v.name));
    if(jp) u.voice=jp;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}
// 答錯回饋:畫面抖動 +(支援的裝置)手機震動
function wrongFeedback(){
  const card=document.querySelector(".card");
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  if(navigator.vibrate) navigator.vibrate([90,50,90]);
}
function accepted(item){
  const set=new Set();
  item[1].forEach(r=>set.add(norm(r)));
  set.add(norm(item[0])); set.add(norm(item[2]));
  return set;
}

/* ── 錯題本(localStorage 持久化) ── */
function loadWrong(){
  try{ return new Set(JSON.parse(localStorage.getItem(WKEY)||"[]")); }catch(e){ return new Set(); }
}
function saveWrong(){ try{ localStorage.setItem(WKEY, JSON.stringify([...wrongSet])); }catch(e){} }
let wrongSet = loadWrong();
function wrongKey(item,m){ return item[0]+"|"+m; }          // 片假名 + 模式 當唯一鍵
function addWrong(item,m){ wrongSet.add(wrongKey(item,m)); saveWrong(); }
function removeWrong(item,m){ if(wrongSet.delete(wrongKey(item,m))) saveWrong(); }
function buildReviewDeck(){
  const byKata = new Map(KANA.map(it=>[it[0], it]));
  const d=[];
  for(const key of wrongSet){
    const bar=key.lastIndexOf("|");
    const k=key.slice(0,bar), m=key.slice(bar+1);
    const it=byKata.get(k);
    if(it) d.push({item:it, mode:m});
  }
  return d;
}
function updateReviewUI(){
  const n=wrongSet.size;
  $("reviewCount").textContent="("+n+")";
  $("reviewBtn").classList.toggle("hidden", n===0);
  $("clearWrong").classList.toggle("hidden", n===0);
}

/* ── 範圍選擇 ── */
function saveGroups(){ try{ localStorage.setItem(GKEY, JSON.stringify([...selectedGroups])); }catch(e){} }
function updateRange(){
  $("rangeCount").textContent = KANA.filter(it=>selectedGroups.has(it[3])).length;
}

/* ── 畫面切換 ── */
function showHome(){
  $("quiz").classList.add("hidden");
  $("result").classList.add("hidden");
  $("doba").classList.add("hidden");
  $("home").classList.remove("hidden");
  updateReviewUI();
}
function showDoba(){
  $("home").classList.add("hidden");
  $("quiz").classList.add("hidden");
  $("result").classList.add("hidden");
  $("doba").classList.remove("hidden");
  speak("どばちゃん、おかえり");   // 只有語音,畫面不顯示文字
}

/* ── 出題 ── */
function start(m){
  reviewMode=false;
  const items = KANA.filter(it=>selectedGroups.has(it[3]));
  deck = shuffle(items).map(it=>({item:it, mode:m}));
  beginQuiz();
}
function startReview(){
  const d = buildReviewDeck();
  if(!d.length){ showHome(); return; }
  reviewMode=true;
  deck = shuffle(d);
  beginQuiz();
}
function beginQuiz(){
  idx=0; correct=0; total=deck.length;
  $("qtotal").textContent=total;
  $("home").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  loadQ();
}

function loadQ(){
  attempts=0;
  const entry=deck[idx];
  $("modeLabel").textContent = (reviewMode?"複習·":"") + (entry.mode==="kata"?"片假名":"平假名");
  $("kana").textContent = shownChar(entry);
  $("qnum").textContent = idx+1;
  $("score").textContent = correct;
  $("prog").style.width = (idx/total*100)+"%";
  const inp=$("ans");
  inp.value=""; inp.disabled=false; inp.className="";
  $("msg").className="msg"; $("msg").innerHTML="&nbsp;";
  $("reveal").textContent="";
  $("check").classList.remove("hidden");
  $("next").classList.add("hidden");
  inp.focus();
}

function check(){
  const entry=deck[idx], item=entry.item, m=entry.mode;
  const inp=$("ans");
  const val=norm(inp.value);

  if(val && accepted(item).has(val)){
    // 答對(第一次或第二次都算整題答對)→ 從錯題本移除
    correct++;
    removeWrong(item,m);
    inp.className="ok"; inp.disabled=true;
    $("msg").className="msg ok";
    $("msg").textContent = attempts===0 ? "正確!" : "答對了!";
    $("score").textContent = correct;
    toNext();
    return;
  }

  // 答錯:抖動 + 震動(不自動唸讀音,可按上面的按鈕聽)
  attempts++;
  wrongFeedback();
  if(attempts===1){
    inp.className="bad";
    $("msg").className="msg bad";
    $("msg").textContent="不對喔,再試一次!";
    inp.value=""; inp.focus();         // 答錯一次後自動清空
  }else{
    // 兩次都錯 → 顯示答案並記入錯題本
    addWrong(item,m);
    inp.className="bad"; inp.disabled=true;
    $("msg").className="msg bad";
    $("msg").textContent="答錯了。";
    const other = m==="kata"
      ? "平假名 <b>"+item[2]+"</b>"
      : "片假名 <b>"+item[0]+"</b>";
    $("reveal").innerHTML = "正確答案:<b>"+item[1][0]+"</b> ・ "+other;
    toNext();
  }
}

function toNext(){
  $("check").classList.add("hidden");
  const nb=$("next");
  nb.classList.remove("hidden");
  nb.textContent = (idx+1>=total) ? "看結果 →" : "下一題 →";
  nb.focus();
}

function next(){
  idx++;
  if(idx>=total){ finish(); return; }
  loadQ();
}

function finish(){
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("resultTitle").textContent = reviewMode
    ? "錯題重練完成 🎉"
    : (deck[0].mode==="kata"?"片假名":"平假名")+" 測驗完成 🎉";
  $("correctCount").textContent = correct;
  $("rtotal").textContent = total;
  const r = total ? correct/total : 0;
  let c;
  if(reviewMode){
    const left = wrongSet.size;
    c = left===0 ? "錯題本清空了,全部攻克!🏆" : "還剩 "+left+" 個,再練一輪 💪";
  }else if(r===1) c="全對!太神啦 🏆";
  else if(r>=0.9) c="超強,幾乎全對!💪";
  else if(r>=0.7) c="很不錯,再拼全對 👍";
  else if(r>=0.5) c="有基礎了,繼續練會更好 🔥";
  else c="多練幾次一定會進步,加油!";
  $("comment").textContent=c;
}

/* ── 事件 ── */
document.querySelectorAll(".chip[data-group]").forEach(ch=>{
  ch.addEventListener("click", ()=>{
    const g=ch.dataset.group;
    if(selectedGroups.has(g)){
      if(selectedGroups.size===1) return;      // 至少保留一個範圍
      selectedGroups.delete(g); ch.classList.remove("on");
    }else{
      selectedGroups.add(g); ch.classList.add("on");
    }
    saveGroups(); updateRange();
  });
});
document.querySelectorAll(".choose[data-mode]").forEach(b=>{
  b.addEventListener("click", ()=> start(b.dataset.mode));
});
$("reviewBtn").addEventListener("click", startReview);
$("clearWrong").addEventListener("click", ()=>{
  if(confirm("確定清空錯題本?")){ wrongSet.clear(); saveWrong(); updateReviewUI(); }
});
$("check").addEventListener("click", check);
$("next").addEventListener("click", next);
$("again").addEventListener("click", ()=>{
  if(reviewMode){ startReview(); }        // 重練會用最新的錯題本;若已空會自動回主畫面
  else start(deck[0].mode);
});
$("backHome").addEventListener("click", showHome);
$("dobaBtn").addEventListener("click", showDoba);
$("wordsBtn").addEventListener("click", ()=>{ location.href="words.html"; });
$("dobaBack").addEventListener("click", ()=>{
  speak("どばちゃん、さようなら");   // 在どば頁播道別語音,不顯示文字
  setTimeout(showHome, 1200);        // 語音在這頁播一下再回主畫面
});
$("speak").addEventListener("click", ()=> speak(shownChar(deck[idx])));
$("ans").addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    if(e.repeat) return;                 // 忽略長按連發
    if(!$("next").classList.contains("hidden")) next();
    else check();
  }
});

// 手機鍵盤彈出時,可視高度變小 → 切換壓縮版排版,確保上方題號/答對數看得到
function fitViewport(){
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.body.classList.toggle("compact", vh < 640);
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", fitViewport);
  window.visualViewport.addEventListener("scroll", fitViewport);
}
window.addEventListener("resize", fitViewport);
window.addEventListener("orientationchange", fitViewport);
fitViewport();

/* ── 啟動:載入已存的範圍選擇 ── */
(function initGroups(){
  try{
    const s=JSON.parse(localStorage.getItem(GKEY)||"null");
    if(Array.isArray(s) && s.length){ selectedGroups.clear(); s.forEach(g=>{ if(GROUP_LABEL[g]) selectedGroups.add(g); }); }
    if(selectedGroups.size===0) selectedGroups.add("seion");
  }catch(e){}
  document.querySelectorAll(".chip[data-group]").forEach(ch=>{
    ch.classList.toggle("on", selectedGroups.has(ch.dataset.group));
  });
  updateRange();
})();

showHome();
</script>
